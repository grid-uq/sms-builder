<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
	<title><h:outputText value="#{msg.etiquetaTopicos}" /></title>
</h:head>
<body>
	<div id="content" align='center'>
		<p:growl id="msgs"/>
		<h:form>
			<p:panelGrid columns="2" layout="flex">
				<p:outputLabel value="Name:" />
				<p:selectOneMenu id="tag" value="#{registroTopicoBean.descripcion}" editable="true" validator="#{registroTopicoBean.validate}" required="true">
					<f:selectItem itemLabel="" itemValue=""/>
					<f:selectItems value="#{registroTopicoBean.tags}"/>
				</p:selectOneMenu>

				<p:outputLabel value="Tags:" />
				<p:selectManyMenu id="advanced" value="#{registroTopicoBean.tagsAsociados}"
								  var="t" filter="true" filterMatchMode="contains" filterNormalize="true"
								  showCheckbox="true" styleClass="manymenu-advanced">
					<f:selectItems value="#{registroTopicoBean.tags}" var="tag" itemLabel="#{tag}" />
					<p:column>
						<h:outputText value="#{t}"/>
					</p:column>
				</p:selectManyMenu>

				<f:facet name="footer">
					<p:commandButton value="#{msg.botonAceptar}"
						action="#{registroTopicoBean.registrar}" update=":msgs"  />
				</f:facet>
			</p:panelGrid>
		</h:form>
		<br />
	</div>
</body>
</html>
